# Squizzy Studio CI: Windows / Linux / macOS matrix + ABI stamp guard.
# Canonical description lives in ci/README.md (GitHub requires workflows under .github/workflows).
name: ci

on:
  push:
  pull_request:

jobs:
  abi:
    name: ABI lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check core ABI headers vs sdk/abi.lock
        run: cmake -P ci/stamp-abi.cmake check
      - name: Print stamp
        run: cmake -P ci/stamp-abi.cmake print

  build:
    needs: abi
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-latest
            preset: linux
          - os: macos-latest
            preset: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.preset }})
    steps:
      - uses: actions/checkout@v4

      - name: Build + test (Windows, via build.ps1 / vcvars64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Preset ${{ matrix.preset }} -BuildDir build/ci -CMakeArgs "-DSQ_WARNINGS_AS_ERRORS=ON" -ExcludeLabel gui

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (POSIX)
        if: runner.os != 'Windows'
        run: ctest --preset ${{ matrix.preset }} -LE gui

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squizzystudio-${{ matrix.os }}
          path: |
            build/*/bin/
          if-no-files-found: ignore
